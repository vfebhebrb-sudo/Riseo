<!DOCTYPE html>

========================= -->
<header class="header">


    <button class="icon-btn theme-btn">

        <i data-lucide="moon"></i>

    </button>




    <div class="header-brand">


        <i data-lucide="brain-circuit"></i>


        <span>
            برنامه کنکور

    </div>



<!-- BACK BUTTON -->

<button class="back-btn" id="backBtn">

    <i data-lucide="arrow-right"></i>

</button>

========================= -->

========================= -->

        USER HEADER

========================================== -->


<div class="exam-user-header" id="userHeader">


<div class="user-icon-box" id="userIconBox">

<i data-lucide="user-round"></i>

</div>

<h3 id="studentName">

--

</h3>


<span id="studentCandidateNumber">

</span>

</div>

</div>




</div>

        اطلاعات آماری
========================================== -->


<div class="exam-info-grid" id="userStatsGrid">





<div class="user-stat" id="studyHistoryStat">


<i data-lucide="calendar-days"></i>


<div>


<span>

سابقه مطالعه

</span>


<strong id="studyDays">

128 روز

</strong>

</div>


</div>








<div class="user-stat" id="examCountStat">


<i data-lucide="target"></i>


<div>


<span>

آزمون داده شده

</span>


<strong id="completedExams">

24 آزمون

</strong>

</div>


</div>








<div class="user-stat" id="scoreStat">


<i data-lucide="chart-column"></i>


<div>


<span>

آخرین تراز

</span>



<strong id="previousScore">

0

</strong>


</div>


</div>








<div class="user-stat" id="streakStat">


<i data-lucide="flame"></i>


<div>


<span>

روزهای پیوسته

</span>



<strong id="streakDays">
18 روز
</strong>


</div>


</div>






</div>









<!-- ==========================================
        PROGRESS BOX
        وضعیت مسیر
========================================== -->


<div class="exam-warning" id="progressBox">


<i data-lucide="sparkles"></i>




<p id="progressText">


آفرین! تا امروز ۷۰٪ مسیر برنامه رو کامل کردی.
ادامه بده تا به هدف نزدیک‌تر بشی.


</p>




</div>

<i data-lucide="files"></i>

<h3>
