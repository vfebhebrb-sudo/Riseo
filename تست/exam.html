<script src="../config.js"></script>

<script>

// =====================================================
// NEW EXAM ANSWER SHEET
// =====================================================

document.addEventListener("DOMContentLoaded", async () => {

    console.log("NEW ANSWER SHEET PAGE READY");


    // =====================================================
    // API
    // =====================================================

    if (typeof API_URL === "undefined") {

        console.error("API_URL پیدا نشد");

        return;
    }


    // =====================================================
    // TOKEN
    // =====================================================

    const token =
        localStorage.getItem("authToken");


    if (!token) {

        console.error("NO TOKEN");

        return;
    }


    // =====================================================
    // EXAM ID
    // =====================================================

    const examId =
        sessionStorage.getItem("selectedExamId");


    if (!examId) {

        console.error("EXAM ID NOT FOUND");

        return;
    }


    console.log(
        "SELECTED EXAM ID:",
        examId
    );


    // =====================================================
    // ANSWER SHEET
    // =====================================================

    const answerSheet =
        document.querySelector(".answer-sheet");


    if (!answerSheet) {

        console.error(
            "ANSWER SHEET NOT FOUND"
        );

        return;
    }


    // =====================================================
    // STATE
    // =====================================================

    let questions = [];

    let answers = {};


    // =====================================================
    // LOAD EXAM
    // =====================================================

    async function loadExam() {

        try {

            console.log(
                "GET EXAM:",
                examId
            );


            const response =
                await fetch(
                    `${API_URL}/tests/${examId}`
                );


            const data =
                await response.json();


            console.log(
                "EXAM DATA:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "خطا در دریافت آزمون"
                );

            }


            // =================================================
            // TEST
            // =================================================

            const test =
                data.test;


            if (!test) {

                throw new Error(
                    "اطلاعات آزمون پیدا نشد"
                );

            }


            // =================================================
            // QUESTIONS
            // =================================================

            questions =
                test.questions || [];


            console.log(
                "QUESTIONS:",
                questions
            );


            console.log(
                "TOTAL QUESTIONS:",
                questions.length
            );


            // =================================================
            // CREATE ANSWER SHEET
            // =================================================

            createAnswerSheet();


        } catch (error) {

            console.error(
                "EXAM LOAD ERROR:",
                error
            );

        }

    }


    // =====================================================
    // CREATE ANSWER SHEET
    // =====================================================

    function createAnswerSheet() {

        // پاک کردن پاسخ نامه قبلی
        answerSheet.innerHTML = "";


        // =================================================
        // CREATE 4 COLUMNS
        // =================================================

        const columns = [];


        for (let i = 0; i < 4; i++) {

            const column =
                document.createElement("div");


            column.className =
                "answer-column";


            columns.push(column);


            answerSheet.appendChild(
                column
            );

        }


        // =================================================
        // NO QUESTIONS
        // =================================================

        if (questions.length === 0) {

            console.warn(
                "NO QUESTIONS"
            );

            return;
        }


        // =================================================
        // 10 QUESTIONS PER COLUMN
        // =================================================

        const questionsPerColumn = 10;


        // =================================================
        // CREATE QUESTIONS
        // =================================================

        questions.forEach(
            (question, index) => {

                const questionNumber =
                    index + 1;


                // =================================================
                // COLUMN
                // =================================================

                const columnIndex =
                    Math.floor(
                        index /
                        questionsPerColumn
                    );


                const safeColumnIndex =
                    Math.min(
                        columnIndex,
                        3
                    );


                const column =
                    columns[
                        safeColumnIndex
                    ];


                // =================================================
                // ROW
                // =================================================

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "answer-row";


                // =================================================
                // QUESTION NUMBER
                // =================================================

                const number =
                    document.createElement(
                        "span"
                    );


                number.className =
                    "question-number";


                number.textContent =
                    questionNumber;


                row.appendChild(
                    number
                );


                // =================================================
                // OPTIONS
                // =================================================

                const optionNumbers =
                    [4, 3, 2, 1];


                optionNumbers.forEach(
                    optionNumber => {

                        // -----------------------------------------
                        // LABEL
                        // -----------------------------------------

                        const label =
                            document.createElement(
                                "label"
                            );


                        label.className =
                            "answer-option";


                        // -----------------------------------------
                        // RADIO
                        // -----------------------------------------

                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            "radio";


                        input.name =
                            `question-${questionNumber}`;


                        input.value =
                            optionNumber;


                        // -----------------------------------------
                        // OPTION NUMBER
                        // -----------------------------------------

                        const optionText =
                            document.createElement(
                                "span"
                            );


                        optionText.textContent =
                            optionNumber;


                        // -----------------------------------------
                        // SAVE ANSWER
                        // -----------------------------------------

                        input.addEventListener(
                            "change",
                            () => {

                                /*
                                    گزینه 1 = index 0
                                    گزینه 2 = index 1
                                    گزینه 3 = index 2
                                    گزینه 4 = index 3
                                */

                                answers[
                                    questionNumber
                                ] =
                                    optionNumber - 1;


                                console.log(
                                    "ANSWER:",
                                    questionNumber,
                                    optionNumber
                                );


                                console.log(
                                    "ALL ANSWERS:",
                                    answers
                                );

                            }
                        );


                        // -----------------------------------------
                        // APPEND
                        // -----------------------------------------

                        label.appendChild(
                            input
                        );


                        label.appendChild(
                            optionText
                        );


                        row.appendChild(
                            label
                        );

                    }
                );


                // =================================================
                // ADD ROW TO COLUMN
                // =================================================

                column.appendChild(
                    row
                );

            }
        );


        console.log(
            "ANSWER SHEET CREATED SUCCESSFULLY"
        );

    }


    // =====================================================
    // FINISH EXAM BUTTON
    // =====================================================

    const finishExamBtn =
        document.getElementById(
            "finish-exam-btn"
        );


    if (finishExamBtn) {

        finishExamBtn.addEventListener(
            "click",
            submitExam
        );

    }


    // =====================================================
    // SUBMIT EXAM
    // =====================================================

    async function submitExam() {

        // جلوگیری از چند بار کلیک
        if (finishExamBtn.disabled) {
            return;
        }


        finishExamBtn.disabled =
            true;


        finishExamBtn.textContent =
            "در حال ثبت آزمون...";


        try {

            // =================================================
            // FINAL DATA
            // =================================================

            const finalExamData = {

                examId:
                    examId,

                answers:
                    answers,

                totalQuestions:
                    questions.length,

                answeredCount:
                    Object.keys(
                        answers
                    ).length,

                remainingCount:
                    questions.length -
                    Object.keys(
                        answers
                    ).length,

                submittedAt:
                    new Date().toISOString()

            };


            console.log(
                "FINAL EXAM DATA:",
                finalExamData
            );


            // =================================================
            // SEND TO SERVER
            // =================================================

            const response =
                await fetch(
                    `${API_URL}/exam-submission/submit`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`

                        },

                        body:
                            JSON.stringify(
                                finalExamData
                            )

                    }
                );


            // =================================================
            // RESPONSE
            // =================================================

            const data =
                await response.json();


            console.log(
                "SUBMIT RESPONSE:",
                data
            );


            // =================================================
            // CHECK RESPONSE
            // =================================================

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "ثبت آزمون ناموفق بود"
                );

            }


            // =================================================
            // SUCCESS
            // =================================================

            showExamSuccess();


        } catch (error) {

            console.error(
                "EXAM SUBMIT ERROR:",
                error
            );


            finishExamBtn.disabled =
                false;


            finishExamBtn.textContent =
                "پایان آزمون";


            alert(
                error.message ||
                "خطایی هنگام ثبت آزمون رخ داد."
            );

        }

    }


    // =====================================================
    // SUCCESS SCREEN
    // =====================================================

    function showExamSuccess() {

        // =================================================
        // OVERLAY
        // =================================================

        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "exam-success-overlay";


        // =================================================
        // BOX
        // =================================================

        const box =
            document.createElement(
                "div"
            );


        box.className =
            "exam-success-box";


        // =================================================
        // SUCCESS TEXT
        // =================================================

        const successText =
            document.createElement(
                "div"
            );


        successText.className =
            "success-text";


        box.appendChild(
            successText
        );


        // =================================================
        // INFO TEXT
        // =================================================

        const infoText =
            document.createElement(
                "div"
            );


        infoText.className =
            "info-text";


        infoText.textContent =
            "پس از بررسی، نتیجه در پنل شما قرار خواهد گرفت.";


        box.appendChild(
            infoText
        );


        // =================================================
        // EXIT BUTTON
        // =================================================

        const exitButton =
            document.createElement(
                "button"
            );


        exitButton.className =
            "exit-exam-btn";


        exitButton.textContent =
            "خروج";


        exitButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    "tests.html";

            }
        );


        box.appendChild(
            exitButton
        );


        // =================================================
        // ADD TO PAGE
        // =================================================

        overlay.appendChild(
            box
        );


        document.body.appendChild(
            overlay
        );


        // =================================================
        // TYPE EFFECT
        // =================================================

        const text =
            "آزمون شما با موفقیت ثبت شد";


        let index = 0;


        function typeText() {

            if (index < text.length) {

                successText.textContent +=
                    text.charAt(index);


                index++;


                setTimeout(
                    typeText,
                    70
                );


            } else {

                // =============================================
                // SHOW INFO TEXT
                // =============================================

                setTimeout(
                    () => {

                        infoText.classList.add(
                            "show"
                        );


                        // =========================================
                        // SHOW EXIT BUTTON
                        // =========================================

                        setTimeout(
                            () => {

                                exitButton.classList.add(
                                    "show"
                                );

                            },
                            900
                        );

                    },
                    400
                );

            }

        }


        typeText();

    }


    // =====================================================
    // START
    // =====================================================

    await loadExam();

});

</script>


    








    <script>
        lucide.createIcons();
    </script>
