</button>

<div class="contact" id="currentContact">

<div class="avatar-box" id="headerAvatar">

<i data-lucide="bot"></i>

<span class="online"></span>

</div>

<!-- ===============================
        ارسال پیام
================================ -->


<footer 
class="message-box"
id="messageBox">





<div class="selected-file" id="selectedFile">

    <div class="selected-file-icon" id="selectedFileIcon">
        <i data-lucide="file"></i>
    </div>

    <div class="selected-file-info">

        <strong id="selectedFileName">
            نام فایل
        </strong>

        <span id="selectedFileSize">
            0 KB
        </span>

    </div>

    <button
        type="button"
        class="remove-file"
        id="removeFile"
    >
        <i data-lucide="x"></i>
    </button>

</div>







<div class="input-area">






<button 
class="send-icon"
id="sendBtn">



<img 
src="../01/d23f70af-6a30-4f7b-993d-1cfac3346844.png"
alt="send">


</button>





<span class="divider"></span>





<button
    class="emoji-btn"
    id="emojiBtn">

    <i data-lucide="smile"></i>

</button>

<div
    class="emoji-picker"
    id="emojiPicker">

    <button type="button">😀</button>
    <button type="button">😂</button>
    <button type="button">😍</button>
    <button type="button">🥰</button>
    <button type="button">😎</button>
    <button type="button">😭</button>
    <button type="button">😡</button>
    <button type="button">👍</button>
    <button type="button">👎</button>
    <button type="button">❤️</button>
    <button type="button">🔥</button>
    <button type="button">✨</button>
    <button type="button">🎉</button>
    <button type="button">😂</button>
    <button type="button">🤍</button>
    <button type="button">💀</button>
    <button type="button">👏</button>
    <button type="button">🙏</button>

</div>



<input

id="messageInput"

type="text"

placeholder="پیام خود را بنویسید...">


 




<button
    class="attach"
    id="attachBtn">

    <i data-lucide="paperclip"></i>

</button>



<input
    type="file"
    id="fileInput"
    hidden>





</footer>







</section>









<!-- ===============================
        لیست گفتگوها
================================ -->



<section 
class="chat-panel"
id="chatPanel">





<div class="chat-title">


<h1>
کنکوری
</h1>



<!-- <button id="chatMenuBtn">

<i data-lucide="ellipsis-vertical"></i>

</button> -->


<!-- BACK BUTTON -->

<button class="back-btn" id="backBtn">

    <i data-lucide="arrow-right"></i>

</button>


</div>








<div class="search-box">



<i data-lucide="search"></i>



<input

id="chatSearch"

placeholder="جستجو در گفتگوها">


</div>









<div class="filters">


<button class="active">
همه
</button>


<button>

خوانده نشده

<span class="badge">
3
</span>


</button>



<button>
گروه‌ها
</button>



<button>
کانال‌ها
</button>



</div>









<!-- لیست چت ها -->


<div 
class="chat-list"
id="chatList">



<!-- مخاطب -->

<div 
class="chat-item active"
data-chat-id="ai">


    <div class="ai-avatar">

        <i data-lucide="bot"></i>

    </div>



    <div class="chat-info">


        <div class="chat-name">


            <strong>

                هوش مصنوعی

                <span class="verified">
                    ✓
                </span>

            </strong>



            <time>
                آنلاین
            </time>


        </div>




        <p>

            سلام 👋 آماده کمک به برنامه کنکور شما هستم

        </p>


    </div>



</div>

</section>

</div>
