<body>






<!-- =========================================
     WORKSPACE HEADER
========================================= -->

<header class="workspace-header" id="workspaceHeader">

    <!-- LEFT -->
    <div class="header-left">

        <!-- Logo -->
        <div class="header-logo">

            <!-- <div class="logo-icon">
                <i data-lucide="graduation-cap"></i>
            </div>

            <span>
                MathCode
            </span> -->

        </div>


        <!-- Pages Panel Button -->
        <button
            class="header-icon-btn"
            id="pagesPanelBtn"
            type="button"
            title="صفحات"
        >
            <i data-lucide="panel-left"></i>
        </button>

        <!-- باز کردن فایل -->
          <div class="sidebar-content">
<button
    class="header-icon-btn open-file-header-btn"
    id="openFileBtn"
    type="button"
    title="باز کردن فایل"
>
    <i data-lucide="folder-open"></i>
</button>
</div>

        <button
    class="header-tool-btn"
    id="ah-headerPenTool"
    type="button"
    title="مداد"
>
    <i data-lucide="pen"></i>
</button>

        <!-- Current File -->
        <button
            class="header-file-btn"
            id="fileInfoBtn"
            type="button"
        >

            <span class="file-type-icon">
                <i data-lucide="file-text"></i>
            </span>

            <span
                class="header-file-name"
                id="workspaceFileName"
            >
                فیزیک پایه - فصل ۳
            </span>

            <i
                class="file-chevron"
                data-lucide="chevron-down"
            ></i>

        </button>

        

    </div>


    <!-- CENTER -->
    <div class="header-center">

        <!-- Previous -->
        <button
            class="header-icon-btn"
            id="previousPageBtn"
            type="button"
        >
            <i data-lucide="chevron-left"></i>
        </button>


        <!-- Page Counter -->
        <div class="header-page-counter">

            <span id="pageNumber">
                3
            </span>

            <span>
                /
            </span>

            <span id="pageCount">
                15
            </span>

        </div>


        <!-- Next -->
        <button
            class="header-icon-btn"
            id="nextPageBtn"
            type="button"
        >
            <i data-lucide="chevron-right"></i>
        </button>

    </div>


    <!-- RIGHT -->
    <div class="header-right">

        <!-- Zoom -->
        <button
            class="header-zoom-btn"
            id="zoomBtn"
            type="button"
        >

            <span id="zoomValue">
                100%
            </span>

            <i data-lucide="chevron-down"></i>

        </button>


        <!-- Refresh / Fit -->
        <button
            class="header-icon-btn"
            id="fitPageBtn"
            type="button"
            title="تنظیم صفحه"
        >
            <i data-lucide="scan"></i>
        </button>


        <!-- Cloud -->
        <button
            class="header-icon-btn"
            id="cloudBtn"
            type="button"
            title="ابر"
        >
            <i data-lucide="cloud"></i>
        </button>


        <!-- Cloud Upload -->
        <button
            class="header-icon-btn"
            id="cloudUploadBtn"
            type="button"
            title="ذخیره ابری"
        >
            <i data-lucide="cloud-upload"></i>
        </button>


        <!-- Settings -->
        <button
            class="header-icon-btn"
            id="settingsBtn"
            type="button"
            title="تنظیمات"
        >
            <i data-lucide="settings"></i>
        </button>


        <!-- User -->
        <button
            class="header-user-btn"
            id="userBtn"
            type="button"
        >

            <span>
                مدرس
            </span>

            <span class="user-avatar">
                <i data-lucide="user"></i>
            </span>

        </button>

    </div>

</header>

<script>
const moreToolsBtn =
    document.getElementById("moreToolsBtn");

const moreToolsPanel =
    document.getElementById("moreToolsPanel");

if (moreToolsBtn && moreToolsPanel) {

    moreToolsBtn.addEventListener(
        "click",
        function () {

            moreToolsPanel.classList.toggle("show");

        }
    );

}
</script>
