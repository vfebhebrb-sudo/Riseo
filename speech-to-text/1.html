    <!-- JavaScript -->
<script src="../config1.js"></script>

<script>

const FILES_API =
    CONFIG.API + CONFIG.ENDPOINTS.FILES;

let knownFiles = [];
let firstLoad = true;
// =====================================
// تبدیل اسم درس
// =====================================

function normalizeLesson(lesson){

    const map = {

        "حسابان ۲": "حسابان",
        "هندسه ۳": "هندسه",
        "گسسته": "گسسته",
        "فیزیک ۳": "فیزیک",
        "شیمی ۳": "شیمی",
        "فارسی ۳": "فارسی",
        "عربی ۳": "عربی",
        "دین و زندگی ۳": "دین و زندگی",
        "زبان انگلیسی ۳": "زبان انگلیسی",
        "سلامت و بهداشت": "سلامت و بهداشت",
        "هویت اجتماعی": "هویت اجتماعی",
        "سایر": "سایر"

    };


    return map[lesson] || lesson;

}



// =====================================
// دریافت فایل ها
// =====================================

async function loadLessonFiles(lesson){


    try{


        const response =
        await fetch(

            `${FILES_API}?lesson=${encodeURIComponent(lesson)}`

        );


        const data =
        await response.json();



        if(data.success){


            renderFiles(
                data.files
            );


        }


    }
    catch(error){


        console.error(
            "FILES ERROR:",
            error
        );


    }


}





// =====================================
// باز کردن فایل
// =====================================
// =====================================
// باز کردن فایل
// =====================================

async function openFile(id){

    try{

        // =========================================
        // مسیر Viewer
        // =========================================

        const VIEWER_URL =
            `${CONFIG.API}${CONFIG.ENDPOINTS.PDF_VIEWER}`;


        // =========================================
        // مسیر PDF
        // =========================================

        const PDF_URL =
            `${CONFIG.API}${CONFIG.ENDPOINTS.FILES}/${id}/pdf`;


        // =========================================
        // ساخت URL نهایی Viewer
        // =========================================

        const viewerUrl =
            `${VIEWER_URL}?file=${encodeURIComponent(PDF_URL)}`;


        // =========================================
        // باز کردن Viewer
        // =========================================

        window.open(
            viewerUrl,
            "_blank"
        );

    }
    catch(error){

        console.error(
            "OPEN FILE ERROR:",
            error
        );

    }

}


// =====================================
// نمایش فایل ها
// =====================================

function renderFiles(files){


    const box =
    document.querySelector(
        ".files-preview-box"
    );


    box.innerHTML = "";



    if(
        !files ||
        files.length === 0
    ){


        box.innerHTML = `

            <div class="empty-files">

                <i data-lucide="folder-open"></i>

                <span>
                    فایلی برای این درس وجود ندارد
                </span>

            </div>

        `;


        lucide.createIcons();

        return;

    }





    files.forEach(file => {


        box.innerHTML += `


        <div 
            class="file-item"
            onclick="openFile('${file.id}')"
        >


            <div class="file-icon">


                   <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" strokeWidth="2" class="w-12 h-12 text-neutral-30 mx-auto mb-3"><path d="M22 10V15C22 20 20 22 15 22H9C4 22 2 20 2 15V9C2 4 4 2 9 2H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M22 10H18C15 10 14 9 14 6V2L22 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M7 13H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M7 17H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>


            </div>



            <div class="file-info">


                <h4>
                    ${file.name}
                </h4>



                <span>
                    ${file.fileType}
                </span>


            </div>




            <i 
                data-lucide="chevron-left">
            </i>



        </div>


        `;



    });



    lucide.createIcons();


}






// =====================================
// کارت های درس
// =====================================

document
.querySelectorAll(".subject-card")
.forEach(card => {


    card.addEventListener(
        "click",
        ()=>{


            const lesson =

            card
            .querySelector("h3")
            .innerText;



            const apiLesson =

            normalizeLesson(
                lesson
            );



            console.log(
                "LOAD:",
                apiLesson
            );



            loadLessonFiles(
                apiLesson
            );


        }
    );


});







// =====================================
// THEME SWITCH
// =====================================

const themeBtn =
document.getElementById(
    "themeToggle"
);



const savedTheme =
localStorage.getItem(
    "theme"
);



if(savedTheme){

    document.body.className =
    savedTheme;

}




if(themeBtn){


themeBtn.addEventListener(
"click",
()=>{


    document.body.classList.toggle(
        "dark-theme"
    );



    if(
        document.body.classList.contains(
            "dark-theme"
        )
    ){


        localStorage.setItem(
            "theme",
            "dark-theme"
        );



        themeBtn.innerHTML =
        `
        <i data-lucide="sun"></i>
        `;


    }
    else{


        localStorage.setItem(
            "theme",
            ""
        );



        themeBtn.innerHTML =
        `
        <i data-lucide="moon"></i>
        `;


    }



    lucide.createIcons();


});

}


// =====================================
// CHECK NEW FILES FOR TELEGRAM
// =====================================

async function checkNewFiles(){


    try{


        const response =
        await fetch(
            FILES_API
        );


        const data =
        await response.json();



        if(
            !data.success ||
            !data.files
        ){

            return;

        }



        const files =
        data.files;



        // بار اول فقط لیست اولیه را نگه می داریم
        if(firstLoad){

            knownFiles =
            files.map(
                f=>f.id
            );

            firstLoad = false;

            return;

        }



        files.forEach(file=>{


            if(
                !knownFiles.includes(file.id)
            ){


                console.log(
                    "🆕 FILE:",
                    file.name
                );



                sendTelegramNotify(
                    file
                );


                knownFiles.push(
                    file.id
                );


            }


        });



    }
    catch(error){

        console.log(
            "CHECK NEW FILE ERROR",
            error
        );

    }


}

async function sendTelegramNotify(file){


    try{


        await fetch(

            CONFIG.API +
            "/api/telegram/new-file",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },


                body:JSON.stringify({

                    name:file.name,

                    type:file.fileType,

                    size:file.size,

                    id:file.id,


                    link:
                    `${CONFIG.API}${CONFIG.ENDPOINTS.FILES}/${file.id}/pdf`

                })

            }

        );


        console.log(
            "✅ Telegram notified"
        );


    }
    catch(error){

        console.log(
            "TELEGRAM ERROR",
            error
        );

    }


}

setInterval(
    checkNewFiles,
    10000
);

</script>
