Math.random()*quranVerses.length
)
];

randomVerse.ayah;



const translation =
document.getElementById("translation");


translation.textContent="";


let i=0;


function typeMeaning(){


if(i < randomVerse.meaning.length){


translation.textContent +=
randomVerse.meaning[i];


i++;


setTimeout(
typeMeaning,
70
);


}


}

typeMeaning,
1200

const introText =
document.getElementById("introText");



const introMessage =

"رایزو همراه تو در مسیر موفقیت است؛ " +
"یک فضای هوشمند برای برنامه‌ریزی، مطالعه، " +
"آزمون و رشد قدم‌به‌قدم. " +
"هر روز یک قدم نزدیک‌تر به هدف خودت باش.";



let introIndex = 0;



function typeIntro(){


if(
introIndex < introMessage.length
){


introText.textContent +=
introMessage[introIndex];


introIndex++;


setTimeout(
typeIntro,
45
);


}


}

typeIntro,
500
);







































let dashboardLoaded = false;

let minimumTimePassed = false;



// زمان شروع

const startTime = Date.now();



// حداقل 10 ثانیه

setTimeout(()=>{


    minimumTimePassed = true;


    checkRedirect();


},10000);





// درخواست آماده شدن داشبورد

function prepareDashboard(){


    const iframe =
    document.createElement("iframe");


    iframe.style.display="none";


    iframe.src =
    "dashboard.html";



    iframe.onload = ()=>{


        dashboardLoaded = true;


        checkRedirect();


    };



    document.body.appendChild(
        iframe
    );


}





function checkRedirect(){


    if(
        dashboardLoaded &&
        minimumTimePassed
    ){


        document.body.classList.add(
            "fade-out"
        );



        setTimeout(()=>{


            window.location.href =
            "index1.html";



        },800);



    }


}



prepareDashboard();
