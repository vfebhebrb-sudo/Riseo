        <nav

<div class="ai-workspace">

    <!-- پنل سمت راست -->

    <aside class="ai-side-panel ai-right-panel">

        <div class="ai-panel-header">
            <div class="ai-panel-icon">
                <i data-lucide="sliders-horizontal"></i>
            </div>

            <div>
                <h2>کنترل دستیار</h2>
                <p>تنظیمات و کنترل‌ها</p>
            </div>
        </div>

        <div class="ai-panel-content" id="aiRightPanelContent">
            <!-- کنترل‌های فعلی را در این قسمت قرار می‌دهیم -->
        </div>

    </aside>


    <!-- بخش مرکزی -->

    <main class="ai-center-column">

        <section class="ai-robot-card">

            <div class="ai-robot-header">
                <div>
                    <span class="ai-status-dot"></span>
                    <span>دستیار هوشمند</span>
                </div>

                <span class="ai-status-label">آماده به کار</span>
            </div>

            <!-- چشم‌های ربات: بدون تغییر در ساختار داخلی -->

            <main class="ai-screen" id="aiScreen">
                <!-- فقط دو چشم ربات -->
                <div class="robot-eyes" id="robotEyes">
                    <div class="eye-unit left-eye">
                        <div class="robot-eye" id="leftEye"></div>
                    </div>

                    <div class="eye-unit right-eye">
                        <div class="robot-eye" id="rightEye"></div>
                    </div>
                </div>
            </main>


        </section>


        <!-- بخش چت در پایین -->

        <section class="ai-chat-card" id="aiChatCard">

            <div class="ai-chat-header">
                <div>
                    <h2>گفت‌وگو</h2>
                    <p>با دستیار هوشمند صحبت کن</p>
                </div>

                <i data-lucide="messages-square"></i>
            </div>

            <div class="ai-chat-messages" id="aiChatMessages">
                <div class="ai-chat-empty">
                    <i data-lucide="message-circle"></i>
                    <p>گفت‌وگوی شما اینجا نمایش داده می‌شود.</p>
                </div>
            </div>

            <form class="ai-chat-form" id="aiChatForm">

                <textarea
                    id="aiChatInput"
                    placeholder="پیامت رو بنویس..."
                    rows="1"
                ></textarea>

                <button
                    type="submit"
                    id="aiChatSend"
                    aria-label="ارسال پیام"
                >
                    <i data-lucide="send"></i>
                </button>

            </form>

        </section>

    </main>


    <!-- پنل سمت چپ -->

    <aside class="ai-side-panel ai-left-panel">

        <div class="ai-panel-header">
            <div class="ai-panel-icon">
                <i data-lucide="layout-grid"></i>
            </div>

            <div>
                <h2>ابزارها</h2>
                <p>امکانات دستیار</p>
            </div>
        </div>

        <div class="ai-panel-content" id="aiLeftPanelContent">
            <!-- ابزارهای فعلی را در این قسمت قرار می‌دهیم -->
        </div>

    </aside>

</div>
