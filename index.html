.category-nav {
    animation: notebookPageIn 1s cubic-bezier(.16, 1, .3, 1) both;
    transform-origin: top center;
}

@keyframes notebookPageIn {

    0% {
        opacity: 0;
        transform:
            translateY(-70px)
            rotateX(-12deg);
    }

    60% {
        opacity: 1;
        transform:
            translateY(8px)
            rotateX(2deg);
    }

    82% {
        transform:
            translateY(-3px)
            rotateX(0);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            rotateX(0);
    }
}

/* =========================================
   RISEO LOGO ANIMATION
========================================= */

.riseo-hero .a4 p {
    animation: riseoLogoIn 1.2s cubic-bezier(.22, 1, .36, 1) both;
}

.riseo-hero .a4 p span {
    display: inline-block;
    opacity: 0;
    transform: translateY(28px);
    animation: riseoLetterIn .8s cubic-bezier(.22, 1, .36, 1) forwards;
}

/* ورود تک تک حروف */

.riseo-hero .a4 p span:nth-child(1) {
    animation-delay: .05s;
}

.riseo-hero .a4 p span:nth-child(2) {
    animation-delay: .12s;
}

.riseo-hero .a4 p span:nth-child(3) {
    animation-delay: .19s;
}

.riseo-hero .a4 p span:nth-child(4) {
    animation-delay: .26s;
}

.riseo-hero .a4 p span:nth-child(5) {
    animation-delay: .33s;
}


@keyframes riseoLetterIn {

    0% {
        opacity: 0;
        transform: translateY(28px);
    }

    70% {
        opacity: 1;
        transform: translateY(-4px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes riseoLogoIn {

    from {
        filter: blur(5px);
    }

    to {
        filter: blur(0);
    }

}




/* =========================================
   RISEO PERIODIC WAVE
========================================= */

.riseo-hero .a4 p span {
    position: relative;
    animation:
        riseoLetterIn .8s cubic-bezier(.22, 1, .36, 1) forwards,
        riseoWave 6s ease-in-out infinite;
}

/* تأخیر ورود اولیه */
.riseo-hero .a4 p span:nth-child(1) {
    animation-delay: .05s, 2s;
}

.riseo-hero .a4 p span:nth-child(2) {
    animation-delay: .12s, 2.12s;
}

.riseo-hero .a4 p span:nth-child(3) {
    animation-delay: .19s, 2.24s;
}

.riseo-hero .a4 p span:nth-child(4) {
    animation-delay: .26s, 2.36s;
}

.riseo-hero .a4 p span:nth-child(5) {
    animation-delay: .33s, 2.48s;
}


/* موج نرم */
@keyframes riseoWave {

    0%,
    58%,
    100% {
        transform: translateY(0) rotate(0deg);
    }

    61% {
        transform: translateY(-7px) rotate(-2deg);
    }

    64% {
        transform: translateY(3px) rotate(1deg);
    }

    67% {
        transform: translateY(-4px) rotate(-1deg);
    }

    70% {
        transform: translateY(0) rotate(0deg);
    }
}
